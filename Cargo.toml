[workspace]
resolver = "3"
members = ["crates/aoc-archive", "crates/harness", "crates/llm-http"]
default-members = ["crates/harness"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
ego-tree = "0.10"
libc = "0.2"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["gzip"] }

[profile.release]
lto = "thin"